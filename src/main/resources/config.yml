# ArchGuard Configuration
# by Aevyx

# Time window in milliseconds to count packets in
# Default: 1000ms (1 second)
window-ms: 1000

# How many violations before kicking the player
# A violation = one window where threshold was exceeded
kick-after-violations: 3

# Cancel (drop) the flooding packets instead of letting them through
cancel-packets: true

# Notify online admins (archguard.admin permission) when a flood is detected
alert-admins: true

# ─────────────────────────────────────────────
# Max packets per type allowed within window-ms
# ─────────────────────────────────────────────
thresholds:
  WINDOW_CLICK: 20      # Inventory clicks — main exploit vector (lower = stricter)
  FLYING: 100           # Generic movement keep-alive
  POSITION: 60          # Position updates
  LOOK: 60              # Look/rotation updates
  POSITION_LOOK: 60     # Combined position+look
  ARM_ANIMATION: 30     # Arm swing animation
  ENTITY_ACTION: 20     # Sneak, sprint, jump
  BLOCK_DIG: 20         # Block breaking
  USE_ITEM: 20          # Item use / right-click
  HELD_ITEM_SLOT: 20    # Hotbar slot switching
  CREATIVE: 15          # Creative mode set-slot
  CHAT: 10              # Chat messages
  TAB_COMPLETE: 5       # Tab-complete requests

# ─────────────────────────────────────────────
# Enable/disable monitoring per packet type
# Set to false to skip checking that packet type
# ─────────────────────────────────────────────
monitor:
  WINDOW_CLICK: true
  FLYING: true
  POSITION: true
  LOOK: true
  POSITION_LOOK: true
  ARM_ANIMATION: true
  ENTITY_ACTION: true
  BLOCK_DIG: true
  USE_ITEM: true
  HELD_ITEM_SLOT: true
  CREATIVE: true
  CHAT: true
  TAB_COMPLETE: true
